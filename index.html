wToast('Could not open camera — check camera permission for this page', true);       return;     }     Quagga.start();     scanning = true;     camStatus.textContent = 'Camera live';     camStatus.classList.add('live');     scanToggle.classList.add('stop');     scanToggleLabel.textContent = 'Stop scanning';   });   Quagga.onDetected(onQuaggaDetected); }  function stopScanning(){   try{ Quagga.offDetected(onQuaggaDetected); }catch(e){}   try{ Quagga.stop(); }catch(e){}   var readerEl = document.getElementById('reader');   if (readerEl) readerEl.innerHTML = '';   scanning = false;   readerWrap.classList.remove('active');   camStatus.textContent = 'Camera off';   camStatus.classList.remove('live');   scanToggle.classList.remove('stop');   scanToggleLabel.textContent = 'Start scanning'; }  scanToggle.addEventListener('click', function(){   if (scanning) stopScanning(); else startScanning(); });  counterSelect.addEventListener('change', function(){   scanToggle.disabled = !counterSelect.value;   scanToggleLabel.textContent = counterSelect.value ? 'Start scanning' : 'Select a counter to start';   var modes = modesForLocation(counterSelect.value);   currentMode = modes[0] || '';   exchangeRole = 'ret';   scanned = [];   renderModeRow();   renderExtraFields();   render(); });  submitBtn.addEventListener('click', function(){   if (!scanned.length || submitting) return;   if (!counterSelect.value){ showToast('Choose a counter first', true); return; }   if (!currentMode){ showToast('Choose an action first', true); return; }   var payload = { mode: MODES[currentMode].endpoint, counter: counterSelect.value };   if (currentMode === 'transfer_out'){     var toSel = document.getElementById('toSelect');     if (!toSel || !toSel.value){ showToast('Choose a destination', true); return; }     payload.toCounter = toSel.value;     var rInp = document.getElementById('reasonInput');     payload.reason = rInp ? rInp.value.trim() : '';     payload.items = scanned.map(function(s){ return { barcode: s.barcode, qty: s.qty }; });   } else if (currentMode === 'transfer_in'){     var fromSel = document.getElementById('fromSelect');     if (!fromSel || !fromSel.value){ showToast("Choose where it's coming from", true); return; }     payload.fromCounter = fromSel.value;     payload.items = scanned.map(function(s){ return { barcode: s.barcode, qty: s.qty }; });   } else if (currentMode === 'writeoff'){     var rInp2 = document.getElementById('reasonInput');     if (!rInp2 || !rInp2.value.trim()){ showToast('Enter a reason', true); return; }     payload.reason = rInp2.value.trim();     payload.items = scanned.map(function(s){ return { barcode: s.barcode, qty: s.qty }; });   } else if (currentMode === 'ret' || currentMode === 'stocktake'){     var nInp = document.getElementById('noteInput');     payload.note = nInp ? nInp.value.trim() : '';     payload.items = scanned.map(function(s){ return { barcode: s.barcode, qty: s.qty }; });   } else if (currentMode === 'exchange'){     payload.returnItems = scanned.filter(function(s){ return s.role === 'ret'; }).map(function(s){ return { barcode: s.barcode, qty: s.qty }; });     payload.saleItems = scanned.filter(function(s){ return s.role === 'sale'; }).map(function(s){ return { barcode: s.barcode, qty: s.qty }; });     if (!payload.returnItems.length && !payload.saleItems.length){ showToast('Scan at least one item', true); return; }   } else {     payload.items = scanned.map(function(s){ return { barcode: s.barcode, qty: s.qty }; });   }   submitting = true;   submitBtn.disabled = true;   submitBtn.textContent = 'Submitting…';   fetch(SUBMIT_URL, { method: 'POST', body: JSON.stringify(payload) })     .then(function(r){ return r.json(); })     .then(function(res){       submitting = false;       submitBtn.textContent = 'Submit all';       if (res && res.success){         showToast('Submitted to ' + payload.counter);         scanned = [];         renderExtraFields();         render();       } else {         showToast((res &
